<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">Research paper analysis pipeline</title><desc id="d">Six colour-coded stages: problem, objective, method, evaluation, findings, limitations.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091526"/><stop offset="1" stop-color="#1c1b3a"/></linearGradient></defs>
<rect width="1200" height="430" rx="24" fill="url(#bg)"/>
<text x="600" y="55" text-anchor="middle" fill="#f4f6ff" font-family="Arial" font-size="28" font-weight="bold" letter-spacing="2">READ A PAPER LIKE A RESEARCHER</text>
<g font-family="Arial" text-anchor="middle">
<g transform="translate(40 118)"><rect width="165" height="180" rx="16" fill="#12364b" stroke="#35d8f2" stroke-width="2"/><circle cx="82" cy="50" r="23" fill="#35d8f2"/><text x="82" y="57" fill="#082033" font-size="19" font-weight="bold">01</text><text x="82" y="105" fill="#aef5ff" font-size="19" font-weight="bold">PROBLEM</text><text x="82" y="137" fill="#c9d7ec" font-size="14">What is wrong</text><text x="82" y="158" fill="#c9d7ec" font-size="14">or unknown?</text></g>
<path d="M210 210h18m-9 -8 9 8 -9 8" stroke="#9bb2d1" stroke-width="3" fill="none"/>
<g transform="translate(235 118)"><rect width="165" height="180" rx="16" fill="#13382f" stroke="#43dfad" stroke-width="2"/><circle cx="82" cy="50" r="23" fill="#43dfad"/><text x="82" y="57" fill="#09241d" font-size="19" font-weight="bold">02</text><text x="82" y="105" fill="#b8ffe4" font-size="19" font-weight="bold">OBJECTIVE</text><text x="82" y="137" fill="#c9d7ec" font-size="14">What is the</text><text x="82" y="158" fill="#c9d7ec" font-size="14">research aim?</text></g>
<path d="M405 210h18m-9 -8 9 8 -9 8" stroke="#9bb2d1" stroke-width="3" fill="none"/>
<g transform="translate(430 118)"><rect width="165" height="180" rx="16" fill="#292044" stroke="#ad91ff" stroke-width="2"/><circle cx="82" cy="50" r="23" fill="#ad91ff"/><text x="82" y="57" fill="#20133c" font-size="19" font-weight="bold">03</text><text x="82" y="105" fill="#e1d5ff" font-size="19" font-weight="bold">METHOD</text><text x="82" y="137" fill="#c9d7ec" font-size="14">What approach</text><text x="82" y="158" fill="#c9d7ec" font-size="14">was used?</text></g>
<path d="M600 210h18m-9 -8 9 8 -9 8" stroke="#9bb2d1" stroke-width="3" fill="none"/>
<g transform="translate(625 118)"><rect width="165" height="180" rx="16" fill="#3a2d19" stroke="#ffca70" stroke-width="2"/><circle cx="82" cy="50" r="23" fill="#ffca70"/><text x="82" y="57" fill="#39260b" font-size="19" font-weight="bold">04</text><text x="82" y="105" fill="#ffe4b1" font-size="19" font-weight="bold">EVALUATION</text><text x="82" y="137" fill="#dcd4c3" font-size="14">How was it</text><text x="82" y="158" fill="#dcd4c3" font-size="14">tested?</text></g>
<path d="M795 210h18m-9 -8 9 8 -9 8" stroke="#9bb2d1" stroke-width="3" fill="none"/>
<g transform="translate(820 118)"><rect width="165" height="180" rx="16" fill="#3b2232" stroke="#ff829f" stroke-width="2"/><circle cx="82" cy="50" r="23" fill="#ff829f"/><text x="82" y="57" fill="#3b1524" font-size="19" font-weight="bold">05</text><text x="82" y="105" fill="#ffd0dc" font-size="19" font-weight="bold">FINDINGS</text><text x="82" y="137" fill="#e5ced7" font-size="14">What did the</text><text x="82" y="158" fill="#e5ced7" font-size="14">evidence show?</text></g>
<path d="M990 210h18m-9 -8 9 8 -9 8" stroke="#9bb2d1" stroke-width="3" fill="none"/>
<g transform="translate(1015 118)"><rect width="150" height="180" rx="16" fill="#253148" stroke="#a9c2e7" stroke-width="2"/><circle cx="75" cy="50" r="23" fill="#a9c2e7"/><text x="75" y="57" fill="#172438" font-size="19" font-weight="bold">06</text><text x="75" y="105" fill="#e1ebfb" font-size="18" font-weight="bold">LIMITS</text><text x="75" y="137" fill="#c9d7ec" font-size="14">What remains</text><text x="75" y="158" fill="#c9d7ec" font-size="14">unproven?</text></g>
</g>
<text x="600" y="365" text-anchor="middle" font-family="Arial" font-size="17" fill="#a8bad8">Separate an author's claim from the evidence that supports it.</text>
</svg>