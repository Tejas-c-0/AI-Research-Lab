<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><rect width="1100" height="430" rx="24" fill="#f7f8fb"/><text x="550" y="58" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#202b3c">Basic data cleaning workflow</text><rect x="45" y="120" width="235" height="220" rx="18" fill="#dceee8" stroke="#64748b" stroke-width="2"/><text x="162" y="180" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#263449">Raw dataset</text><text x="162" y="225" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">Original information</text><path d="M285 230 h25 m-10 -10 l10 10 -10 10" stroke="#64748b" stroke-width="4" fill="none"/><rect x="315" y="120" width="235" height="220" rx="18" fill="#e7e4f6" stroke="#64748b" stroke-width="2"/><text x="432" y="180" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#263449">Find problems</text><text x="432" y="225" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">Check missing,</text><text x="432" y="255" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">repeated and invalid</text><text x="432" y="285" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">data</text><path d="M555 230 h25 m-10 -10 l10 10 -10 10" stroke="#64748b" stroke-width="4" fill="none"/><rect x="585" y="120" width="235" height="220" rx="18" fill="#f8e8cf" stroke="#64748b" stroke-width="2"/><text x="702" y="180" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#263449">Clean data</text><text x="702" y="225" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">Correct or handle the</text><text x="702" y="255" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">issues</text><path d="M825 230 h25 m-10 -10 l10 10 -10 10" stroke="#64748b" stroke-width="4" fill="none"/><rect x="855" y="120" width="235" height